<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โรงเรียนวัดแสนเกษม สำนักงานเขตหนองจอก กรุงเทพมหานคร</title>
<meta name="description" content="เว็บไซต์โรงเรียนวัดแสนเกษม สำนักงานเขตหนองจอก กรุงเทพมหานคร — ข่าวกิจกรรม ปฏิทิน บุคลากร และข้อมูลติดต่อ">
<meta property="og:title" content="โรงเรียนวัดแสนเกษม">
<meta property="og:description" content="ข่าวกิจกรรม · ปฏิทิน · บุคลากร · ติดต่อโรงเรียน — สำนักงานเขตหนองจอก กรุงเทพมหานคร">
<meta name="theme-color" content="#0b6b3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ======= ตั้งค่า: ลิงก์ข้อมูลจากระบบโรงเรียน (Apps Script) ======= */
:root { --g: #0b6b3a; --g2: #0b3d24; --gold: #d4a017; --bg: #f4f8f5; --ink: #1f2a24; --muted: #6b7a70; --line: #e3ebe5; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: 'Sarabun', sans-serif; color: var(--ink); background: #fff; font-size: 16px; line-height: 1.6; }
a { color: var(--g); }
img { max-width: 100%; display: block; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* หัวเว็บ */
.nav { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.97); border-bottom: 3px solid var(--gold); backdrop-filter: blur(6px); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.logo { width: 48px; height: 48px; border-radius: 50%; flex: none; background: #fff; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--g); font-weight: 800; font-size: 20px; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.brand b { display: block; font-size: 18px; color: var(--g); line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.menu { display: flex; gap: 4px; }
.menu a { text-decoration: none; color: #333; padding: 8px 11px; border-radius: 8px; font-weight: 600; font-size: 15px; }
.menu a.on, .menu a:hover { color: var(--g); background: #e9f4ed; }
.burger { display: none; border: 0; background: none; font-size: 28px; cursor: pointer; color: var(--g); padding: 4px 8px; }
@media (max-width: 860px) {
  .burger { display: block; }
  .menu { display: none; position: absolute; left: 0; right: 0; top: 100%; background: #fff; flex-direction: column; padding: 8px 16px 14px; box-shadow: 0 10px 20px rgba(0,0,0,.08); }
  .menu.open { display: flex; }
  .menu a { padding: 12px; font-size: 16px; }
}

/* ภาพปก */
.hero { position: relative; color: #fff; background: linear-gradient(90deg, rgba(6,60,32,.94), rgba(6,60,32,.7) 55%, rgba(6,60,32,.35)), linear-gradient(135deg, #7fb98e, #2f7d4f 45%, #c9a227); background-size: cover; background-position: center; }
.hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 30px; align-items: center; padding-top: 56px; padding-bottom: 86px; }
.hero h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.25; font-weight: 800; }
.hero p { margin: 12px 0 24px; font-size: 18px; opacity: .93; }
.hero .pic { border-radius: 18px; overflow: hidden; border: 4px solid rgba(255,255,255,.75); aspect-ratio: 4/3; box-shadow: 0 16px 40px rgba(0,0,0,.25); background: rgba(255,255,255,.15); }
.hero .pic img { width: 100%; height: 100%; object-fit: cover; }
.btn { display: inline-block; padding: 11px 22px; border-radius: 26px; font-weight: 700; text-decoration: none; margin: 0 8px 8px 0; font-size: 15.5px; border: 0; cursor: pointer; font-family: inherit; }
.btn.gold { background: var(--gold); color: #2a1d00; }
.btn.line { border: 1.5px solid #fff; color: #fff; background: rgba(255,255,255,.12); }
.btn.green { background: var(--g); color: #fff; }
@media (max-width: 760px) { .hero .wrap { grid-template-columns: 1fr; padding-top: 34px; padding-bottom: 70px; } .hero .pic { display: none; } .hero p { font-size: 16px; } }

.stats { position: relative; margin-top: -42px; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.1); overflow: hidden; }
.stats div { padding: 16px 10px; text-align: center; border-right: 1px solid var(--line); }
.stats div:last-child { border: 0; }
.stats b { display: block; font-size: 25px; color: var(--g); line-height: 1.3; }
.stats span { font-size: 13.5px; color: var(--muted); }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr 1fr; } .stats div:nth-child(2) { border-right: 0; } .stats div:nth-child(-n+2) { border-bottom: 1px solid var(--line); } .stats b { font-size: 20px; } }

/* ส่วนต่างๆ */
section { padding: 46px 0; }
section.tint { background: var(--bg); }
.hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 18px; }
h2 { margin: 0; font-size: 27px; color: var(--g); line-height: 1.3; }
h2 + .sub, .sub { color: var(--muted); font-size: 14px; }
.more { font-weight: 700; text-decoration: none; white-space: nowrap; }
.page-title { background: linear-gradient(120deg, var(--g2), var(--g)); color: #fff; padding: 34px 0; }
.page-title h1 { margin: 0; font-size: 32px; }
.page-title p { margin: 4px 0 0; opacity: .85; }

/* ข่าว */
.news { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.news.home { grid-template-columns: 1.4fr 1fr 1fr; }
.card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.08); text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,.12); }
.card .im { position: relative; aspect-ratio: 16/10; background: linear-gradient(135deg, #cfe8d6, #86bf98); display: flex; align-items: center; justify-content: center; font-size: 40px; }
.card .im img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.tag { position: absolute; left: 10px; top: 10px; z-index: 1; background: #fff; color: var(--g); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 12px; }
.cnt { position: absolute; right: 10px; bottom: 10px; z-index: 1; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 1px 8px; border-radius: 10px; }
.card .t { padding: 12px 16px 2px; font-weight: 700; font-size: 16.5px; line-height: 1.45; }
.card .d { padding: 0 16px 14px; font-size: 13px; color: var(--muted); }
@media (max-width: 860px) { .news, .news.home { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .news, .news.home { grid-template-columns: 1fr; } }

/* ปฏิทิน */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.ev { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
.ev.past { opacity: .5; }
.ev.now { outline: 2px solid var(--gold); }
.dt { width: 60px; flex: none; text-align: center; background: var(--g); color: #fff; border-radius: 12px; padding: 5px 0; line-height: 1.1; }
.dt b { display: block; font-size: 21px; }
.dt small { font-size: 12px; }
.ev .tt { font-weight: 700; font-size: 15px; line-height: 1.4; }
.ev .ow { font-size: 13px; color: var(--muted); }
.month { font-size: 19px; font-weight: 800; color: var(--g); margin: 22px 0 10px; padding-left: 10px; border-left: 5px solid var(--gold); }

/* ผู้บริหาร */
.dir { display: flex; gap: 18px; background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.06); align-items: flex-start; }
.dir .ph { width: 130px; aspect-ratio: 3/4; flex: none; border-radius: 12px; overflow: hidden; background: linear-gradient(160deg, #e3efe7, #b9d8c3); display: flex; align-items: flex-end; justify-content: center; font-size: 60px; }
.dir .ph img { width: 100%; height: 100%; object-fit: cover; }
.dir q { display: block; color: #444; white-space: pre-line; }
@media (max-width: 480px) { .dir { flex-direction: column; align-items: center; text-align: center; } }

/* บุคลากร */
.staff { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; text-align: center; }
.av { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 8px; overflow: hidden; border: 4px solid var(--gold); background: linear-gradient(160deg, #e3efe7, #b9d8c3); display: flex; align-items: center; justify-content: center; font-size: 46px; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.staff .n { font-weight: 700; font-size: 15px; line-height: 1.4; }
.staff .r { color: var(--muted); font-size: 13px; }
.grp { margin: 26px 0 12px; font-size: 20px; color: var(--g); font-weight: 800; }

/* เกี่ยวกับ / ข่าวเต็ม */
.prose { max-width: 820px; white-space: pre-line; font-size: 17px; }
.box { background: #fff; border-radius: 16px; padding: 20px 24px; box-shadow: 0 1px 6px rgba(0,0,0,.06); margin-bottom: 18px; }
.box h3 { margin: 0 0 8px; color: var(--g); font-size: 20px; }
.box ol { margin: 0; padding-left: 22px; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 18px; }
.gal a { border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; display: block; background: #eef3ef; }
.gal img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
.gal a:hover img { transform: scale(1.04); }
.lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50; display: flex; align-items: center; justify-content: center; }
.lb img { max-width: 94vw; max-height: 86vh; border-radius: 8px; }
.lb button { position: absolute; background: rgba(255,255,255,.18); border: 0; color: #fff; font-size: 30px; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; }
.lb .x { top: 16px; right: 16px; } .lb .p { left: 12px; } .lb .nx { right: 12px; }
.lb .c { position: absolute; bottom: 14px; color: #ddd; font-size: 14px; }

/* ติดต่อ / ท้ายเว็บ */
.contact { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .contact { grid-template-columns: 1fr; } }
.ci { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; font-size: 16.5px; }
.ci span:first-child { font-size: 22px; }
footer { background: var(--g2); color: #d9ece0; padding: 30px 0 18px; font-size: 14.5px; }
footer .wrap { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 24px; }
footer b { color: #fff; font-size: 16px; display: block; margin-bottom: 6px; }
footer a { color: #d9ece0; text-decoration: none; display: block; margin-bottom: 4px; }
footer a:hover { color: #fff; }
.copy { text-align: center; color: #9fc0ab; font-size: 12.5px; margin-top: 18px; grid-column: 1 / -1; border-top: 1px solid rgba(255,255,255,.12); padding-top: 12px; }
@media (max-width: 760px) { footer .wrap { grid-template-columns: 1fr; } }

.empty { background: #fff; border: 1.5px dashed #c8d8cd; border-radius: 14px; padding: 24px; text-align: center; color: var(--muted); }
.sk { background: linear-gradient(90deg, #eef3ef 25%, #f7faf8 50%, #eef3ef 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 14px; height: 210px; }
@keyframes sk { to { background-position: -200% 0; } }
.note { background: #fff7e0; color: #7a5a00; padding: 8px 14px; font-size: 13.5px; text-align: center; }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="#"><div class="logo" id="logo">ส</div><div style="min-width:0"><b>โรงเรียนวัดแสนเกษม</b><small id="aff">สำนักงานเขตหนองจอก กรุงเทพมหานคร</small></div></a>
  <button class="burger" id="burger" aria-label="เมนู">☰</button>
  <nav class="menu" id="menu">
    <a href="#" data-r="">หน้าแรก</a><a href="#about" data-r="about">เกี่ยวกับเรา</a><a href="#staff" data-r="staff">บุคลากร</a>
    <a href="#news" data-r="news">ข่าวกิจกรรม</a><a href="#calendar" data-r="calendar">ปฏิทิน</a><a href="#contact" data-r="contact">ติดต่อ</a>
  </nav>
</div></header>
<div id="note"></div>
<main id="app"><div class="wrap" style="padding:40px 20px"><div class="sk"></div></div></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
// ===== ตั้งค่า: ลิงก์ระบบโรงเรียน (Web App ของระบบตารางสอน) =====
const API = 'https://script.google.com/macros/s/AKfycbxcOJT-I3bpSGXQphtBv-lC9AHwo0IAcb2WK-7YddeiChbo00rLNEu_ZmaLlG-dPSNj/exec';
const PORTAL = 'https://napitchayasirapathsakul-stack.github.io/teacher-tracker/';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const img = (id, w) => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 800);
const safeUrl = (u) => /^https:\/\//.test(String(u || '')) ? String(u) : '';
const MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const MF = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const thDate = (iso) => { const [y, m, d] = String(iso || '').split('-').map(Number); return y ? d + ' ' + MS[m - 1] + ' ' + (y + 543) : ''; };
const todayIso = () => { const d = new Date(Date.now() + 7 * 3600e3); return d.toISOString().slice(0, 10); };
let D = null;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
async function load() {
  const cached = store('sks_site');
  if (cached) { try { D = JSON.parse(cached); render(); } catch (e) { D = null; } }
  try {
    const r = await fetch(API + '?api=site&t=' + Math.floor(Date.now() / 60000));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'โหลดข้อมูลไม่สำเร็จ');
    D = j.data; store('sks_site', JSON.stringify(D)); $('note').innerHTML = ''; render();
  } catch (e) {
    if (!D) { D = { info: {}, news: [], staff: [], events: [], school_name: 'โรงเรียนวัดแสนเกษม' }; render(); }
    $('note').innerHTML = '<div class="note">ขณะนี้เชื่อมต่อข้อมูลล่าสุดไม่ได้ — แสดงข้อมูลที่บันทึกไว้ (ลองรีเฟรชอีกครั้ง)</div>';
  }
}

// ---------- ส่วนประกอบ ----------
const I = () => D.info || {};
function newsCard(n) {
  return '<a class="card" href="#news/' + esc(n.id) + '"><div class="im">' + (n.images[0] ? '<img loading="lazy" src="' + img(n.images[0], 900) + '" alt="">' : '📰') +
    '<span class="tag">' + esc(n.category) + '</span>' + (n.images.length > 1 ? '<span class="cnt">📷 ' + n.images.length + '</span>' : '') + '</div>' +
    '<div class="t">' + esc(n.title) + '</div><div class="d">' + thDate(n.date) + '</div></a>';
}
function evState(e, t) { const s = e.start, en = e.end || e.start; if (!s) { const ym = t.slice(0, 7); return e.month < ym ? 'past' : e.month === ym ? 'now' : 'next'; } return t > en ? 'past' : t >= s ? 'now' : 'next'; }
function evRow(e, t) {
  const st = evState(e, t), [y, m, d] = String(e.start || e.month + '-').split('-');
  return '<div class="ev ' + st + '"><div class="dt"><b>' + (d ? Number(d) : '•') + '</b><small>' + MS[Number(m) - 1] + '</small></div><div><div class="tt">' + esc(e.title) + (st === 'now' ? ' <span style="color:#b07d00;font-size:13px">● วันนี้/เดือนนี้</span>' : '') + '</div><div class="ow">' + esc(e.text) + (e.owner ? ' · ' + esc(e.owner) : '') + '</div></div></div>';
}
function person(p) { return '<div><div class="av">' + (p.photo ? '<img loading="lazy" src="' + img(p.photo, 300) + '" alt="">' : (p.role === 'ผู้บริหาร' ? '👩‍💼' : '🧑‍🏫')) + '</div><div class="n">' + esc(p.name) + '</div><div class="r">' + esc(p.role) + '</div></div>'; }
function empty(msg) { return '<div class="empty">' + msg + '</div>'; }
function pageTitle(t, s) { return '<div class="page-title"><div class="wrap"><h1>' + t + '</h1>' + (s ? '<p>' + s + '</p>' : '') + '</div></div>'; }
function directorBox() {
  const i = I(); if (!i.director_name && !i.director_message) return '';
  return '<div class="dir"><div class="ph">' + (i.director ? '<img src="' + img(i.director, 500) + '" alt="">' : '👩‍💼') + '</div><div>' +
    (i.director_message ? '<q>' + esc(i.director_message) + '</q>' : '') + '<div style="margin-top:10px"><b style="color:var(--g)">' + esc(i.director_name) + '</b><br><span class="sub">' + esc(i.director_title || 'ผู้อำนวยการโรงเรียนวัดแสนเกษม') + '</span></div></div></div>';
}

// ---------- หน้า ----------
function home() {
  const i = I(), t = D.today || todayIso();
  const up = D.events.filter((e) => evState(e, t) !== 'past').slice(0, 5);
  const hero = '<div class="hero"' + (i.hero ? ' style="background-image:linear-gradient(90deg,rgba(6,60,32,.94),rgba(6,60,32,.72) 55%,rgba(6,60,32,.4)),url(\'' + img(i.hero, 1800) + '\')"' : '') + '><div class="wrap"><div>' +
    '<h1>ยินดีต้อนรับสู่<br>' + esc(D.school_name || 'โรงเรียนวัดแสนเกษม') + '</h1><p>' + esc(i.site_motto || i.site_welcome || 'สำนักงานเขตหนองจอก กรุงเทพมหานคร') + '</p>' +
    '<a class="btn gold" href="#news">📰 ข่าวล่าสุด</a><a class="btn line" href="#calendar">🗓️ ปฏิทินกิจกรรม</a></div>' +
    (i.hero ? '<div class="pic"><img src="' + img(i.hero, 1000) + '" alt=""></div>' : '<div></div>') + '</div></div>';
  const stats = '<div class="wrap"><div class="stats"><div><b>' + esc(i.site_levels || 'อนุบาล–ป.6') + '</b><span>ระดับที่เปิดสอน</span></div><div><b>' + D.staff.length + '</b><span>ครูและบุคลากร</span></div><div><b>' + esc(D.term || '–') + '</b><span>ภาคเรียนปัจจุบัน</span></div><div><b>' + D.news.length + '</b><span>ข่าวและกิจกรรม</span></div></div></div>';
  const welcome = i.site_welcome && i.site_motto ? '<section style="padding-bottom:0"><div class="wrap" style="text-align:center"><h2>ยินดีต้อนรับ</h2><p class="prose" style="margin:8px auto 0">' + esc(i.site_welcome) + '</p></div></section>' : '';
  const news = '<section><div class="wrap"><div class="hd"><div><h2>ข่าวและกิจกรรม</h2><div class="sub">ความเคลื่อนไหวล่าสุดของโรงเรียน</div></div><a class="more" href="#news">ดูทั้งหมด →</a></div>' +
    (D.news.length ? '<div class="news home">' + D.news.slice(0, 3).map(newsCard).join('') + '</div>' : empty('ยังไม่มีข่าว')) + '</div></section>';
  const mid = '<section class="tint"><div class="wrap two"><div><div class="hd"><div><h2>กิจกรรมที่กำลังจะมาถึง</h2><div class="sub">จากปฏิทินปฏิบัติงาน' + (D.events_year ? ' ปีการศึกษา ' + D.events_year : '') + '</div></div><a class="more" href="#calendar">ทั้งปี →</a></div>' +
    (up.length ? up.map((e) => evRow(e, t)).join('') : empty('ไม่มีกิจกรรมที่กำลังจะมาถึง')) + '</div>' +
    '<div>' + (directorBox() ? '<div class="hd"><h2>สารจากผู้บริหาร</h2></div>' + directorBox() : '<div class="hd"><h2>เกี่ยวกับโรงเรียน</h2></div><div class="box"><p style="margin:0">' + esc(i.site_vision || i.site_history || 'โรงเรียนวัดแสนเกษม สังกัดสำนักการศึกษา กรุงเทพมหานคร') + '</p><a class="more" href="#about">อ่านต่อ →</a></div>') + '</div></div></section>';
  const staff = '<section><div class="wrap"><div class="hd"><div><h2>คณะครูและบุคลากร</h2><div class="sub">' + D.staff.length + ' คน</div></div><a class="more" href="#staff">ดูทั้งหมด →</a></div><div class="staff">' + D.staff.slice(0, 6).map(person).join('') + '</div></div></section>';
  return hero + stats + welcome + news + mid + staff;
}
function about() {
  const i = I(), mis = String(i.site_mission || '').split('\n').map((s) => s.trim()).filter(Boolean);
  let h = pageTitle('เกี่ยวกับโรงเรียน', esc(D.school_name) + ' ' + esc(D.affiliation || '')) + '<section class="tint"><div class="wrap">';
  if (directorBox()) h += '<div style="margin-bottom:18px">' + directorBox() + '</div>';
  if (i.site_history) h += '<div class="box"><h3>ประวัติโรงเรียน</h3><div class="prose">' + esc(i.site_history) + '</div></div>';
  if (i.site_vision) h += '<div class="box"><h3>วิสัยทัศน์</h3><div class="prose">' + esc(i.site_vision) + '</div></div>';
  if (mis.length) h += '<div class="box"><h3>พันธกิจ</h3><ol>' + mis.map((m) => '<li>' + esc(m) + '</li>').join('') + '</ol></div>';
  if (i.site_identity) h += '<div class="box"><h3>อัตลักษณ์และเอกลักษณ์</h3><div class="prose">' + esc(i.site_identity) + '</div></div>';
  if (!i.site_history && !i.site_vision && !mis.length && !directorBox()) h += empty('กำลังจัดทำข้อมูล');
  return h + '</div></section>';
}
function staffPage() {
  const groups = {}; D.staff.forEach((p) => (groups[p.role] = groups[p.role] || []).push(p));
  return pageTitle('คณะครูและบุคลากร', D.staff.length + ' คน') + '<section><div class="wrap">' +
    (D.staff.length ? Object.keys(groups).map((g) => '<div class="grp">' + esc(g) + '</div><div class="staff">' + groups[g].map(person).join('') + '</div>').join('') : empty('กำลังจัดทำข้อมูล')) + '</div></section>';
}
function newsPage() {
  return pageTitle('ข่าวและกิจกรรม', D.news.length + ' รายการ') + '<section class="tint"><div class="wrap">' + (D.news.length ? '<div class="news">' + D.news.map(newsCard).join('') + '</div>' : empty('ยังไม่มีข่าว')) + '</div></section>';
}
let GAL = [];
function newsOne(id) {
  const n = D.news.find((x) => x.id === id); if (!n) return newsPage();
  GAL = n.images;
  return pageTitle(esc(n.title), thDate(n.date) + ' · ' + esc(n.category)) + '<section><div class="wrap">' +
    (n.body ? '<div class="prose">' + esc(n.body) + '</div>' : '') +
    (n.images.length ? '<div class="gal">' + n.images.map((im, k) => '<a href="#" data-lb="' + k + '"><img loading="lazy" src="' + img(im, 700) + '" alt=""></a>').join('') + '</div>' : '') +
    '<p style="margin-top:24px"><a class="btn green" href="#news">← ข่าวทั้งหมด</a></p></div></section>';
}
function calendar() {
  const t = D.today || todayIso(); let cur = '', h = '';
  D.events.forEach((e) => { if (e.month !== cur) { cur = e.month; const [y, m] = cur.split('-').map(Number); h += '<div class="month" id="m-' + cur + '">เดือน' + MF[m - 1] + ' ' + (y + 543) + '</div>'; } h += evRow(e, t); });
  return pageTitle('ปฏิทินกิจกรรม', D.events_year ? 'ปีการศึกษา ' + D.events_year : '') + '<section class="tint"><div class="wrap" style="max-width:820px">' + (h || empty('ยังไม่มีข้อมูลปฏิทิน')) + '</div></section>';
}
function contact() {
  const i = I(), fb = safeUrl(i.site_facebook), map = safeUrl(i.site_map);
  const rows = [['📍', i.site_address], ['☎️', i.site_phone && '<a href="tel:' + esc(String(i.site_phone).replace(/[^0-9+]/g, '')) + '">' + esc(i.site_phone) + '</a>'], ['✉️', i.site_email && '<a href="mailto:' + esc(i.site_email) + '">' + esc(i.site_email) + '</a>'], ['📘', fb && '<a href="' + esc(fb) + '" target="_blank" rel="noopener">Facebook โรงเรียน</a>']]
    .filter((r) => r[1]).map((r) => '<div class="ci"><span>' + r[0] + '</span><span>' + (r[0] === '📍' ? esc(r[1]) : r[1]) + '</span></div>').join('');
  return pageTitle('ติดต่อโรงเรียน', esc(D.school_name)) + '<section class="tint"><div class="wrap contact"><div class="box"><h3>' + esc(D.school_name) + '</h3><p class="sub" style="margin-top:0">' + esc(D.affiliation || '') + '</p>' + (rows || '<p class="sub">กำลังจัดทำข้อมูลติดต่อ</p>') + '</div>' +
    '<div class="box"><h3>แผนที่</h3>' + (map ? '<p>กดปุ่มเพื่อเปิดเส้นทางใน Google Maps</p><a class="btn green" href="' + esc(map) + '" target="_blank" rel="noopener">📍 เปิดแผนที่</a>' : '<p class="sub">กำลังจัดทำข้อมูลแผนที่</p>') + '</div></div></section>';
}
function foot() {
  const i = I(), fb = safeUrl(i.site_facebook), map = safeUrl(i.site_map);
  return '<div><b>' + esc(D.school_name || 'โรงเรียนวัดแสนเกษม') + '</b>' + esc(D.affiliation || 'สำนักงานเขตหนองจอก กรุงเทพมหานคร') + (i.site_address ? '<br>📍 ' + esc(i.site_address) : '') + (i.site_phone ? '<br>☎️ ' + esc(i.site_phone) : '') + '</div>' +
    '<div><b>เมนู</b><a href="#about">เกี่ยวกับเรา</a><a href="#news">ข่าวกิจกรรม</a><a href="#calendar">ปฏิทิน</a><a href="#contact">ติดต่อ</a></div>' +
    '<div><b>ลิงก์</b>' + (fb ? '<a href="' + esc(fb) + '" target="_blank" rel="noopener">📘 Facebook โรงเรียน</a>' : '') + (map ? '<a href="' + esc(map) + '" target="_blank" rel="noopener">📍 แผนที่</a>' : '') +
    '<a href="https://www.bangkok.go.th/education" target="_blank" rel="noopener">สำนักการศึกษา กทม.</a><a href="' + PORTAL + '">👩‍🏫 ระบบงานครู</a></div>' +
    '<div class="copy">© ' + (new Date().getFullYear() + 543) + ' ' + esc(D.school_name || 'โรงเรียนวัดแสนเกษม') + '</div>';
}

function render() {
  if (!D) return;
  const i = I();
  if (i.logo) $('logo').innerHTML = '<img src="' + img(i.logo, 200) + '" alt="โลโก้">';
  if (D.affiliation) $('aff').textContent = D.affiliation;
  const [r, id] = location.hash.replace(/^#\/?/, '').split('/');
  const pages = { about, staff: staffPage, news: () => (id ? newsOne(id) : newsPage()), calendar, contact };
  $('app').innerHTML = (pages[r] || home)();
  $('foot').innerHTML = foot();
  document.querySelectorAll('#menu a').forEach((a) => a.classList.toggle('on', a.dataset.r === (pages[r] ? r : '')));
  if (r === 'calendar' && !render._scrolled) { const el = $('m-' + (D.today || todayIso()).slice(0, 7)); if (el) { render._scrolled = true; setTimeout(() => el.scrollIntoView({ block: 'start' }), 50); } }
}
function lightbox(k) {
  const bg = document.createElement('div'); bg.className = 'lb';
  const show = () => (bg.innerHTML = '<img src="' + img(GAL[k], 1800) + '" alt=""><button class="x">✕</button>' + (GAL.length > 1 ? '<button class="p">‹</button><button class="nx">›</button>' : '') + '<div class="c">' + (k + 1) + ' / ' + GAL.length + '</div>');
  show(); document.body.appendChild(bg);
  bg.onclick = (e) => { if (e.target.classList.contains('p')) { k = (k - 1 + GAL.length) % GAL.length; show(); } else if (e.target.classList.contains('nx')) { k = (k + 1) % GAL.length; show(); } else bg.remove(); };
}
window.addEventListener('hashchange', () => { $('menu').classList.remove('open'); render._scrolled = false; render(); window.scrollTo(0, 0); });
$('burger').onclick = () => $('menu').classList.toggle('open');
document.addEventListener('click', (e) => { const a = e.target.closest('[data-lb]'); if (a) { e.preventDefault(); lightbox(Number(a.dataset.lb)); } });
load();
</script>
</body>
</html>
